<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الهواتف الذكية | TECH ZONE</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
    <!-- شبكة الخلفية -->
    <div class="grid-overlay"></div>
    
    <!-- شريط التنقل -->
    <nav>
        <div class="logo">TECH ZONE</div>
        <div class="nav-links">
            <a href="#">الرئيسية</a> 
            <a href="#">الهواتف</a> 
            <a href="#">الإكسسوارات</a> 
            <a href="#">اتصل بنا</a>
        </div>
    </nav>

    <!-- حاوية التمرير السينمائي -->
    <div class="scroll-container">
        <section class="hero">
            <!-- النصوص -->
            <div class="hero-content">
                <div class="hero-top-text">NEXT GENERATION TECH</div>
                <h1 class="hero-title">اكتشف المستقبل<br><span>بين يديك</span></h1>
                <p class="hero-subtitle">أحدث الهواتف الذكية من آيفون، سامسونج، جوجل، هونر، وشاومي. تكنولوجيا متطورة وتصميم يعكس الفخامة.</p>
                <button class="cta-button">استكشف الأجهزة</button>
            </div>

            <!-- الهواتف -->
            <div class="hero-visual">
                <div class="glow-effect"></div>
                
                <div class="phone-container">
                    <!-- ⚠️ تأكد أن أسماء الصور هنا تطابق أسماء ملفاتك في GitHub بالضبط ⚠️ -->
                    <img src="iPhone.PNG" alt="iPhone" class="phone phone-1">
                    <img src="samsung.JPG" alt="Samsung" class="phone phone-2">
                    <img src="pixel.JPG" alt="Google Pixel" class="phone phone-3">
                    <img src="honor.JPG" alt="Honor" class="phone phone-4">
                    <img src="xiaomi.JPG" alt="Xiaomi" class="phone phone-5">
                </div>
            </div>
        </section>
    </div>

    <!-- ربط ملف الجافاسكريبت -->
    <script src="script.js"></script>
</body>
</html>
