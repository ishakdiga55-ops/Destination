<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination - متجر الهواتف الذكية</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبة Google Model Viewer المجانية لعرض الـ 3D -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #0b0b0b;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .hero-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* تنسيق عارض المجسم الثلاثي الأبعاد */
        model-viewer {
            width: 100%;
            height: 85vh;
            background-color: transparent;
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <!-- عارض الهاتف 3D مع تفعيل الدوران التلقائي والتحكم باليد -->
        <model-viewer 
            src="iPhone%2014%20pro.glb" 
            alt="iPhone 14 Pro 3D Model" 
            auto-rotate 
            camera-controls 
            shadow-intensity="1">
        </model-viewer>
    </div>

    <script src="script.js"></script>
</body>
</html>
