<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكالة السفر الفاخرة</title>
    <!-- تضمين Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تخصيص بعض إعدادات Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'], // يفضل استخدام خط أنيق مثل Tajawal
                    },
                    colors: {
                        'luxury-dark': '#0f172a',
                        'luxury-gold': '#d4af37',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- تضمين GSAP و ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body class="bg-luxury-dark text-white overflow-x-hidden">

    <!-- قسم البطل (Hero Section) -->
    <section class="relative h-screen flex items-center justify-center overflow-hidden">
        <!-- صورة خلفية مع تأثير التعتيم -->
        <div class="absolute inset-0 bg-black/60 z-10"></div>
        <img src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074&auto=format&fit=crop" 
             alt="طائرة في السماء" 
             class="absolute inset-0 w-full h-full object-cover hero-bg">
        
        <div class="z-20 text-center px-4 hero-content">
            <p class="text-luxury-gold tracking-widest mb-4 text-lg">السفر يعاد تعريفه</p>
            <h1 class="text-5xl md:text-7xl font-bold mb-6 leading-tight">باريس تبدأ<br>قبل أن تهبط.</h1>
            <button class="px-8 py-3 mt-4 border border-white/50 rounded-full hover:bg-white hover:text-luxury-dark transition duration-300 backdrop-blur-sm">
                اكتشف رحلتك
            </button>
        </div>
    </section>

    <!-- قسم الوجهات -->
    <section class="py-24 px-6 md:px-20 bg-luxury-dark relative z-20">
        <div class="max-w-7xl mx-auto">
            <h2 class="text-4xl font-bold mb-16 text-center section-title">وجهات حصرية</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <!-- البطاقة الأولى -->
                <div class="relative group overflow-hidden rounded-2xl destination-card h-96 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1572487045501-14022c4f4d22?q=80&w=1969&auto=format&fit=crop" alt="موريشيوس" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                    <div class="absolute bottom-0 p-8">
                        <h3 class="text-3xl font-bold mb-2">موريشيوس</h3>
                        <p class="text-gray-300">ملاذ استوائي يفوق الخيال</p>
                    </div>
                </div>

                <!-- البطاقة الثانية -->
                <div class="relative group overflow-hidden rounded-2xl destination-card h-96 cursor-pointer mt-0 md:mt-16">
                    <img src="https://images.unsplash.com/photo-1539650116574-8efeb43e2750?q=80&w=2070&auto=format&fit=crop" alt="مصر" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                    <div class="absolute bottom-0 p-8">
                        <h3 class="text-3xl font-bold mb-2">مصر</h3>
                        <p class="text-gray-300">عظمة التاريخ والفخامة الحديثة</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- سكربت الحركات (Animations) -->
    <script>
        gsap.registerPlugin(ScrollTrigger);

        // حركة قسم البطل عند تحميل الصفحة
        gsap.from(".hero-content > *", {
            y: 50,
            opacity: 0,
            duration: 1.2,
            stagger: 0.2,
            ease: "power3.out",
            delay: 0.5
        });

        // تأثير اختلاف المنظور (Parallax) للصورة الخلفية
        gsap.to(".hero-bg", {
            yPercent: 30,
            ease: "none",
            scrollTrigger: {
                trigger: "section",
                start: "top top",
                end: "bottom top",
                scrub: true
            }
        });

        // ظهور بطاقات الوجهات عند التمرير
        gsap.from(".destination-card", {
            y: 100,
            opacity: 0,
            duration: 1,
            stagger: 0.3,
            scrollTrigger: {
                trigger: ".section-title",
                start: "top 80%", // تبدأ الحركة عندما يصل عنوان القسم إلى 80% من الشاشة
                toggleActions: "play none none reverse"
            }
        });
    </script>
</body>
</html>
