<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكالة الحج والعمرة |.en ضيوف الرحمن</title>
    
able    <!-- استدعاءPan خط عربي جميل وفخم (م =ثل خط "أميري" أو " falseتجوال") -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    
    <!-- استدعاء مكتبة GSAP للحركات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        /* إعدادات عامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            /* لون خلفية أخضر داكن جداً يبعث على الطمأنينة (بدلاً من الأزرق) */
            background-color: #06120e; 
            color: white;
            overflow-x: hidden;
        }

        /* قسم البداية (Hero Section) */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #globe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* النص فوق الكرة */
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            padding: 0 20px;
            background: radial-gradient(circle, rgba(6,18,14,0.7) 0%, rgba(6,18,14,0) 70%); /* تعتيم خلف النص لبروزه */
        }

        .hero-subtitle {
            font-size: 1.4rem;
            color: #d4af37; /* لون ذهبي فخم */
            margin-bottom: 20px;
            letter-spacing: 2px;
            font-family: 'Amiri', serif; /* خط عربي كلاسيكي للنصوص الدينية */
        }

        .hero-title {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 900;
            line-height: 1.3;
            text-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }
        
        .hero-title span {
            color: #d4af37; /* تمييز كلمة أو جملة بالذهبي */
        }

        /* قسم الباقات (الذي يظهر عند التمرير) */
        .packages-section {
            position: relative;
            z-index: 10;
            background-color: #06120e;
            min-height: 100vh;
            padding: 80px 20px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.2); /* خط ذهبي خفيف */
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            color: #d4af37;
        }

        .section-subtitle {
            color: #94a3b8;
            font-size: 1.2rem;
            margin-bottom: 50px;
        }

        /* إخفاء شريط التمرير */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #06120e; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 1. القسم الأول: الواجهة الرئيسية -->
    <section class="hero-section">
        <div id="globe-container"></div>
        
        <div class="hero-content">
            <div class="hero-subtitle">بكل طمأنينة وراحة بال</div>
            <h1 class="hero-title">لبيك اللهم لبيك<br><span>ضيوف الرحمن</span></h1>
        </div>
    </section>

    <!-- 2. القسم الثاني: باقات العمرة والحج -->
    <section class="packages-section">
        <h2 class="section-title">رحلتك الإيمانية تبدأ هنا</h2>
        <p class="section-subtitle">اكتشف باقاتنا الحصرية للحج والعمرة المصممة لراحتك</p>
        <!-- سيتم إضافة بطاقات الباقات هنا لاحقاً -->
    </section>

    <!-- استدعاء Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- كود الكرة الأرضية 3D والحركات -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- إعدادات Three.js ---
        const scene = new THREE.Scene();
        // ضباب بلون الخلفية الجديدة (الأخضر الداكن)
        scene.fog = new THREE.FogExp2(0x06120e, 0.02); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('globe-container').appendChild(renderer.domElement);

        // التحكم
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3; // دوران أبطأ وأكثر هدوءاً
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // إنشاء الكرة
        const geometry = new THREE.SphereGeometry(2, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        
        const material = new THREE.MeshStandardMaterial({
            map: earthTexture,
            roughness: 0.8,
            metalness: 0.1,
        });

        const earth = new THREE.Mesh(geometry, material);
        
        // --- توجيه الكرة نحو الشرق الأوسط (مكة) ---
        // هذا الرقم (1.5) تقريبي لجعل منطقة الشرق الأوسط في الواجهة
        earth.rotation.y = 1.5; 
        
        scene.add(earth);

        // الغلاف الجوي
        const atmosphereGeometry = new THREE.SphereGeometry(2.05, 64, 64);
        const atmosphereMaterial = new THREE.MeshBasicMaterial({
            color: 0xd4af37, // هالة باللون الذهبي
            transparent: true,
            opacity: 0.1,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        atmosphere.rotation.y = 1.5; // نفس توجيه الكرة
        scene.add(atmosphere);

        // الإضاءة (تعديل إضاءة الشمس لتعطي لوناً ذهبياً دافئاً)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffd700, 2); // ضوء ذهبي
        directionalLight.position.set(5, 3, 5);
        scene.add(directionalLight);

        // موضع الكرة
        const updateGlobePosition = () => {
            if (window.innerWidth > 768) {
                earth.position.x = 2.5;
                atmosphere.position.x = 2.5;
                camera.position.z = 8;
            } else {
                earth.position.x = 0;
                earth.position.y = 0.5;
                atmosphere.position.x = 0;
                atmosphere.position.y = 0.5;
                camera.position.z = 7;
            }
        };
        updateGlobePosition();

        // --- حركات GSAP ---
        gsap.registerPlugin(ScrollTrigger);

        // عند التمرير، تدور الكرة ببطء لتظهر باقي العالم
        gsap.to(earth.rotation, {
            y: earth.rotation.y + Math.PI * 1.5, // تدور مسافة أكبر
            x: Math.PI / 6,
            ease: "none",
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 2 // حركة ناعمة جداً
            }
        });
        gsap.to(atmosphere.rotation, {
            y: atmosphere.rotation.y + Math.PI * 1.5,
            x: Math.PI / 6,
            ease: "none",
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 2
            }
        });

        // --- حلقة الرسم ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateGlobePosition();
        });
    </script>
</body>
</html>
