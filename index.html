<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination | السفر يعاد تعريفه</title>
    
    <!-- استدعاء خط عربي جميل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- استدعاء مكتبة GSAP للحركات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        /* إعدادات عامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a; /* لون أزرق داكن جداً كخلفية احتياطية */
            color: white;
            overflow-x: hidden;
        }

        /* قسم البداية (Hero Section) */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* حاوية الكرة الأرضية 3D */
        #globe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* خلف النص */
        }

        /* النص فوق الكرة */
        .hero-content {
            position: relative;
            z-index: 10; /* أمام الكرة */
            text-align: center;
            pointer-events: none; /* لكي يتمكن المستخدم من تدوير الكرة من خلف النص */
            padding: 0 20px;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #facc15; /* لون ذهبي */
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .hero-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem); /* حجم متجاوب مع الشاشة */
            font-weight: 900;
            line-height: 1.2;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8); /* ظل ليظهر النص فوق أي خلفية */
        }

        /* قسم الوجهات (الذي يظهر عند التمرير) */
        .destinations-section {
            position: relative;
            z-index: 10;
            background-color: #0f172a;
            min-height: 100vh;
            padding: 80px 20px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 50px;
            font-weight: 700;
        }

        /* قسم توضيحي للبطاقات */
        .placeholder-text {
            color: #94a3b8;
            font-size: 1.2rem;
        }

        /* إخفاء شريط التمرير لمظهر أنيق */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>

    <!-- 1. القسم الأول: الواجهة الرئيسية -->
    <section class="hero-section">
        <div id="globe-container"></div>
        
        <div class="hero-content">
            <div class="hero-subtitle">السفر يعاد تعريفه</div>
            <h1 class="hero-title">باريس تبدأ<br>قبل أن تهبط.</h1>
        </div>
    </section>

    <!-- 2. القسم الثاني: الوجهات الحصرية -->
    <section class="destinations-section">
        <h2 class="section-title">وجهات حصرية</h2>
        <p class="placeholder-text">هنا سنقوم بإضافة بطاقات الوجهات السياحية قريباً...</p>
    </section>

    <!-- استدعاء Three.js (الحديث) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- كود الكرة الأرضية 3D والحركات -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- إعدادات Three.js ---
        const scene = new THREE.Scene();
        // إضافة ضباب لدمج الكرة مع الخلفية
        scene.fog = new THREE.FogExp2(0x0f172a, 0.02); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('globe-container').appendChild(renderer.domElement);

        // التحكم بالكرة
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // إنشاء الكرة الأرضية
        const geometry = new THREE.SphereGeometry(2, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        // صورة أرض واقعية عالية الدقة
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        
        const material = new THREE.MeshStandardMaterial({
            map: earthTexture,
            roughness: 0.8,
            metalness: 0.1,
        });

        const earth = new THREE.Mesh(geometry, material);
        scene.add(earth);

        // إضافة الغلاف الجوي
        const atmosphereGeometry = new THREE.SphereGeometry(2.05, 64, 64);
        const atmosphereMaterial = new THREE.MeshBasicMaterial({
            color: 0x4a90e2,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
        directionalLight.position.set(5, 3, 5);
        scene.add(directionalLight);

        // ضبط مكان الكرة (على اليمين في الكمبيوتر، وفي المنتصف بالأعلى في الجوال)
        const updateGlobePosition = () => {
            if (window.innerWidth > 768) {
                earth.position.x = 2.5;
                atmosphere.position.x = 2.5;
                camera.position.z = 8;
            } else {
                earth.position.x = 0;
                earth.position.y = 0.5;
                atmosphere.position.x = 0;
                atmosphere.position.y = 0.5;
                camera.position.z = 7;
            }
        };
        updateGlobePosition();

        // --- حركات GSAP ScrollTrigger ---
        gsap.registerPlugin(ScrollTrigger);

        // دوران الكرة مع التمرير للأسفل
        gsap.to(earth.rotation, {
            y: Math.PI * 2,
            x: Math.PI / 4,
            ease: "none",
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1.5
            }
        });
        gsap.to(atmosphere.rotation, {
            y: Math.PI * 2,
            x: Math.PI / 4,
            ease: "none",
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1.5
            }
        });

        // --- حلقة الرسم ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // التجاوب مع حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateGlobePosition();
        });
    </script>
</body>
</html>
