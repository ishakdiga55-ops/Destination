<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الهواتف الذكية | TECH ZONE</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
    <div class="grid-overlay"></div>
    
    <nav>
        <div class="logo">TECH ZONE</div>
        <div class="nav-links">
            <a href="#">الرئيسية</a> 
            <a href="#">الهواتف</a> 
            <a href="#">الإكسسوارات</a> 
            <a href="#">اتصل بنا</a>
        </div>
    </nav>

    <!-- حاوية التمرير السينمائي -->
    <div class="scroll-container">
        <section class="hero">
            <div class="hero-content">
                <div class="hero-top-text">NEXT GENERATION TECH</div>
                <h1 class="hero-title">اكتشف المستقبل<br><span>بين يديك</span></h1>
                <p class="hero-subtitle">أحدث الهواتف الذكية من آيفون، سامسونج، وجودل بيكسل. تكنولوجيا متطورة وتصميم يعكس الفخامة.</p>
                <button class="cta-button">استكشف الأجهزة</button>
            </div>

            <div class="hero-visual">
                <div class="glow-effect"></div>
                
                <!-- حاوية الهواتف الثلاثة -->
                <div class="phone-container">
                    <!-- الهاتف الأول: iPhone 15 Pro (شفاف) -->
                    <img src="https://raw.githubusercontent.com/jonnyjackson26/device-frames-media/main/device-frames-output/Apple/iPhone%2015%20Pro/Natural%20Titanium/frame.png" alt="iPhone 15 Pro" class="phone phone-1">
                    
                    <!-- الهاتف الثاني: Samsung Galaxy S24 Ultra (شفاف) -->
                    <img src="https://raw.githubusercontent.com/jonnyjackson26/device-frames-media/main/device-frames-output/Samsung/Galaxy%20S24%20Ultra/Titanium%20Black/frame.png" alt="Samsung S24 Ultra" class="phone phone-2">
                    
                    <!-- الهاتف الثالث: Google Pixel 8 Pro (شفاف) -->
                    <img src="https://raw.githubusercontent.com/jonnyjackson26/device-frames-media/main/device-frames-output/Google/Pixel%208%20Pro/Obsidian/frame.png" alt="Google Pixel 8 Pro" class="phone phone-3">
                </div>
            </div>
        </section>
    </div>

    <!-- مساحة فارغة بعد الهيرو -->
    <div class="spacer"></div>

    <script src="script.js"></script>
</body>
</html>
