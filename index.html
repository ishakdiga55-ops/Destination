<script>
        gsap.registerPlugin(ScrollTrigger);

        // حركة دخول العناصر
        gsap.from(".hero-top-text", { y: -20, opacity: 0, duration: 1, delay: 0.2 });
        gsap.from(".hero-title", { x: 50, opacity: 0, duration: 1, delay: 0.4 });
        gsap.from(".hero-subtitle", { x: 50, opacity: 0, duration: 1, delay: 0.6 });
        gsap.from(".cta-button", { x: 50, opacity: 0, duration: 1, delay: 0.8 });

        // الحركة السينمائية (مخففة لتعمل بسلاسة)
        let tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".scroll-container",
                start: "top top",
                end: "bottom top",
                scrub: 1, /* تقليل وقت الاستجابة ليكون أخف */
                pin: true,
            }
        });

        tl.to(".image-wrapper", { 
            scale: 1.3,           // تكبير بسيط
            rotationY: 15,        // ميلان خفيف (بدون انقلاب)
            y: -50,
            ease: "power2.inOut" 
        })
        .to(".hero-content", {
            opacity: 0,
            y: -50,
            ease: "power2.inOut"
        }, "<");
    </script>
