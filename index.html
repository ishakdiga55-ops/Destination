<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكالة السفر الفاخرة</title>
    
    <!-- تضمين Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    },
                    colors: {
                        'luxury-dark': '#0f172a',
                        'luxury-gold': '#d4af37',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- تضمين مكتبات GSAP و ScrollTrigger و Lenis و Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-luxury-dark text-white overflow-x-hidden">

    <!-- حاوية المجسم ثلاثي الأبعاد (الكرة الأرضية) -->
    <div id="globe-container" class="fixed top-0 left-0 w-full h-full pointer-events-none z-10 opacity-60"></div>

    <!-- قسم البطل (Hero Section) -->
    <section class="relative h-screen flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-black/70 z-0"></div>
        <img src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074&auto=format&fit=crop" 
             alt="طائرة في السماء" 
             class="absolute inset-0 w-full h-full object-cover hero-bg -z-10">
        
        <div class="z-20 text-center px-4 hero-content mt-10">
            <p class="text-luxury-gold tracking-widest mb-4 text-lg">السفر يعاد تعريفه</p>
            <h1 class="text-5xl md:text-7xl font-bold mb-6 leading-tight drop-shadow-lg">باريس تبدأ<br>قبل أن تهبط.</h1>
            <button class="px-8 py-3 mt-4 border border-white/50 rounded-full hover:bg-white hover:text-luxury-dark transition duration-300 backdrop-blur-sm pointer-events-auto">
                اكتشف رحلتك
            </button>
        </div>
    </section>

    <!-- قسم الوجهات -->
    <!-- استخدمنا خلفية شبه شفافة لتستمر الكرة الأرضية بالظهور بخفة -->
    <section class="py-24 px-6 md:px-20 bg-luxury-dark/80 backdrop-blur-sm relative z-20">
        <div class="max-w-7xl mx-auto">
            <h2 class="text-4xl font-bold mb-16 text-center section-title">وجهات حصرية</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="relative group overflow-hidden rounded-2xl destination-card h-96 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1572487045501-14022c4f4d22?q=80&w=1969&auto=format&fit=crop" alt="موريشيوس" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                    <div class="absolute bottom-0 p-8">
                        <h3 class="text-3xl font-bold mb-2">موريشيوس</h3>
                        <p class="text-gray-300">ملاذ استوائي يفوق الخيال</p>
                    </div>
                </div>

                <div class="relative group overflow-hidden rounded-2xl destination-card h-96 cursor-pointer mt-0 md:mt-16">
                    <img src="https://images.unsplash.com/photo-1539650116574-8efeb43e2750?q=80&w=2070&auto=format&fit=crop" alt="مصر" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                    <div class="absolute bottom-0 p-8">
                        <h3 class="text-3xl font-bold mb-2">مصر</h3>
                        <p class="text-gray-300">عظمة التاريخ والفخامة الحديثة</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- أكواد الجافاسكربت للحركات والتجسيم -->
    <script>
        // 1. إعداد التمرير السلس (Lenis)
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // 2. إعداد GSAP وربطه مع Lenis
        gsap.registerPlugin(ScrollTrigger);
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => { lenis.raf(time * 1000); });
        gsap.ticker.lagSmoothing(0, 0);

        // حركات النصوص والصور (GSAP)
        gsap.from(".hero-content > *", {
            y: 50,
            opacity: 0,
            duration: 1.2,
            stagger: 0.2,
            ease: "power3.out",
            delay: 0.5
        });

        gsap.to(".hero-bg", {
            yPercent: 30,
            ease: "none",
            scrollTrigger: {
                trigger: "section",
                start: "top top",
                end: "bottom top",
                scrub: true
            }
        });

        gsap.from(".destination-card", {
            y: 100,
            opacity: 0,
            duration: 1,
            stagger: 0.3,
            scrollTrigger: {
                trigger: ".section-title",
                start: "top 85%",
                toggleActions: "play none none reverse"
            }
        });

        // 3. إعداد الكرة الأرضية (Three.js)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('globe-container').appendChild(renderer.domElement);

        const geometry = new THREE.SphereGeometry(2.5, 32, 32);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0xd4af37, 
            wireframe: true,
            transparent: true,
            opacity: 0.25 
        });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        camera.position.z = 5;
        // إزاحة خفيفة لتناسب الشاشات (تتوسط الهاتف، وتنزاح يميناً في الكمبيوتر)
        globe.position.x = window.innerWidth > 768 ? 1.5 : 0; 

        // ربط دوران الكرة بالتمرير
        gsap.to(globe.rotation, {
            y: Math.PI * 2,
            x: Math.PI / 4,
            ease: "none",
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1.5
            }
        });

        // تشغيل المشهد 3D
        function animate3D() {
            requestAnimationFrame(animate3D);
            globe.rotation.y += 0.0005; // دوران ذاتي بطيء جداً
            renderer.render(scene, camera);
        }
        animate3D();

        // تجاوب المجسم مع تغير حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            globe.position.x = window.innerWidth > 768 ? 1.5 : 0;
        });
    </script>
</body>
</html>
