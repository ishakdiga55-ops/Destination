<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكالة الحج والعمرة | ضيوف الرحمن</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #06120e; 
            color: white;
            overflow-x: hidden;
        }

        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #globe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* تصميم الطائرة */
        .airplane-container {
            position: absolute;
            z-index: 5;
            /* نضعها مبدئياً فوق الجزائر تقريباً (في المنتصف) */
            top: 55%;
            left: 50%;
            width: 80px;
            height: 80px;
            pointer-events: none;
            /* تدوير الطائرة لتبدو متجهة نحو الشرق */
            transform: translate(-50%, -50%) rotate(-45deg); 
        }

        .airplane-container img {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.8)); /* توهج ذهبي للطائرة */
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            padding: 0 20px;
            background: radial-gradient(circle, rgba(6,18,14,0.7) 0%, rgba(6,18,14,0) 70%);
            margin-top: 50px; /* إنزال النص قليلاً ليتناسب مع الحجم الجديد */
        }

        .hero-subtitle {
            font-size: 1.4rem;
            color: #d4af37;
            margin-bottom: 20px;
            font-family: 'Amiri', serif;
        }

        .hero-title {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 900;
            line-height: 1.3;
            text-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }
        
        .hero-title span {
            color: #d4af37;
        }

        .packages-section {
            position: relative;
            z-index: 10;
            background-color: #06120e;
            min-height: 100vh;
            padding: 80px 20px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            color: #d4af37;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #06120e; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 4px; }
    </style>
</head>
<body>

    <section class="hero-section">
        <div id="globe-container"></div>
        
        <!-- إضافة الطائرة (استخدمت أيقونة SVG مجانية) -->
        <div class="airplane-container" id="airplane">
            <img src="https://cdn-icons-png.flaticon.com/512/7893/7893979.png" alt="طائرة">
        </div>

        <div class="hero-content">
            <div class="hero-subtitle">بكل طمأنينة وراحة بال</div>
            <h1 class="hero-title">لبيك اللهم لبيك<br><span>ضيوف الرحمن</span></h1>
        </div>
    </section>

    <section class="packages-section">
        <h2 class="section-title">رحلتك الإيمانية تبدأ هنا</h2>
        <p style="color: #94a3b8; font-size: 1.2rem;">اكتشف باقاتنا الحصرية للحج والعمرة المصممة لراحتك</p>
    </section>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- إعدادات Three.js ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x06120e, 0.02); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('globe-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3; 
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // إنشاء الكرة
        const geometry = new THREE.SphereGeometry(2, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        
        const material = new THREE.MeshStandardMaterial({
            map: earthTexture,
            roughness: 0.8,
            metalness: 0.1,
        });

        const earth = new THREE.Mesh(geometry, material);
        
        // --- توجيه الكرة نحو الجزائر (شمال أفريقيا) ---
        // الرقم 1.57 (تقريباً باي/2) يجعل قارة أفريقيا في المنتصف
        earth.rotation.y = 1.57; 
        
        scene.add(earth);

        const atmosphereGeometry = new THREE.SphereGeometry(2.05, 64, 64);
        const atmosphereMaterial = new THREE.MeshBasicMaterial({
            color: 0xd4af37,
            transparent: true,
            opacity: 0.1,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        atmosphere.rotation.y = 1.57;
        scene.add(atmosphere);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffd700, 2);
        directionalLight.position.set(5, 3, 5);
        scene.add(directionalLight);

        // --- تصغير الكرة الأرضية ---
        const updateGlobePosition = () => {
            if (window.innerWidth > 768) {
                earth.position.x = 2.5;
                atmosphere.position.x = 2.5;
                camera.position.z = 10; // تم زيادة الرقم لتبدو الكرة أصغر
            } else {
                earth.position.x = 0;
                earth.position.y = 0.2;
                atmosphere.position.x = 0;
                atmosphere.position.y = 0.2;
                camera.position.z = 9; // تصغير الكرة في الجوال
            }
        };
        updateGlobePosition();

        // --- حركات GSAP ---
        gsap.registerPlugin(ScrollTrigger);

        // 1. حركة الكرة الأرضية عند التمرير
        gsap.to(earth.rotation, {
            y: earth.rotation.y + Math.PI * 1.5, 
            x: Math.PI / 6,
            ease: "none",
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 2 
            }
        });
        gsap.to(atmosphere.rotation, {
            y: atmosphere.rotation.y + Math.PI * 1.5,
            x: Math.PI / 6,
            ease: "none",
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 2
            }
        });

        // 2. حركة الطائرة (تطير من الجزائر نحو مكة عند التمرير)
        gsap.to("#airplane", {
            top: "10%",           // ترتفع للأعلى
            left: "85%",          // تتجه لليمين (ناحية الشرق حيث مكة)
            scale: 2.5,           // تكبر وكأنها تقترب من المشاهد
            rotation: 20,         // تغير زاوية ميلانها
            opacity: 0,           // تختفي تدريجياً وكأنها دخلت السحاب
            ease: "power2.inOut",
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "50% top",   // تنتهي الحركة عند منتصف التمرير
                scrub: 1.5
            }
        });

        // --- حلقة الرسم ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateGlobePosition();
        });
    </script>
</body>
</html>
