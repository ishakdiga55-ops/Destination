<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination - متجر الهواتف الذكية</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبة Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <!-- مكتبة GSAP للتأثيرات الحركية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

    <!-- القسم الوحيد: (iPhone 14 Pro) -->
    <section class="hero-section">
        <!-- تم نقل شريط التنقل إلى هنا -->
        <nav class="navbar">
            <div class="logo">DESTINATION</div>
            <ul class="nav-links">
                <li><a href="#">الرئيسية</a></li>
                <li><a href="#">المتجر</a></li>
                <li><a href="#">اتصل بنا</a></li>
            </ul>
        </nav>

        <div class="hero-content">
            <h2>إصدار جديد كلياً</h2>
            <p>تصميم مبتكر وأداء خارق يغير مقاييس الهواتف الذكية.</p>
            <button class="btn">اطلب نسختك</button>
        </div>

        <!-- حاوية المجسم ثلاثي الأبعاد -->
        <div class="model-container">
            <model-viewer 
                src="iphone-14-pro.glb" 
                alt="iPhone 14 Pro 3D Model" 
                auto-rotate 
                camera-controls 
                camera-orbit="0deg 75deg 120%" 
                scale="1 1 1"
                interaction-prompt="none"
                shadow-intensity="1">
            </model-viewer>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
