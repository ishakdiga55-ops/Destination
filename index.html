<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination - متجر الهواتف الذكية</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبة Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body>

    <!-- القسم الأول -->
    <section class="hero-section">
        <nav class="navbar">
            <div class="logo">DESTINATION</div>
            <ul class="nav-links">
                <li><a href="#">الرئيسية</a></li>
                <li><a href="#">المتجر</a></li>
                <li><a href="#">اتصل بنا</a></li>
            </ul>
        </nav>

        <!-- حاوية المجسم ثلاثي الأبعاد في المنتصف -->
        <div class="model-container">
            <model-viewer 
                src="iPhone%2014%20pro.glb" 
                alt="iPhone 14 Pro 3D" 
                auto-rotate 
                camera-controls 
                shadow-intensity="1">
            </model-viewer>
        </div>

        <div class="hero-content">
            <h2>iPhone Pro Max</h2>
            <p>القوة، الفخامة، والتكنولوجيا بين يديك.</p>
            <button class="btn">اكتشف الآن</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
